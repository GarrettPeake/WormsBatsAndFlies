<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="LLM orchestration system inspired by Neal Stephenson's Anathem">
  <title>WormsBatsAndFlies - LLM Orchestration</title>

  <!-- Preload critical CSS -->
  <link rel="preload" href="/css/reset.css" as="style">
  <link rel="preload" href="/css/variables.css" as="style">
  <link rel="preload" href="/css/layout.css" as="style">
  <link rel="preload" href="/css/components.css" as="style">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="/css/reset.css">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2'><circle cx='12' cy='12' r='10'/><path d='M12 2a10 10 0 0 1 0 20'/><circle cx='12' cy='12' r='4'/></svg>">

  <!-- Three.js import map for ES modules -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.182.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.182.0/examples/jsm/"
      }
    }
  </script>

  <style>
    /* Initial loading state */
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: var(--color-bg-primary);
      color: var(--color-text-primary);
    }

    .app-loading__content {
      text-align: center;
    }

    .app-loading__spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto var(--space-4);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loading state shown while JS loads -->
  <div id="app-loading" class="app-loading">
    <div class="app-loading__content">
      <div class="app-loading__spinner"></div>
      <p>Loading WormsBatsAndFlies...</p>
    </div>
  </div>

  <!-- App shell will be mounted here -->
  <app-shell id="app"></app-shell>

  <!-- Main script -->
  <script type="module" src="/main.js"></script>
</body>
</html>
